id: "04"
slug: multi-agent-a2a
title: Attacking Multi-Agent Systems & A2A Protocols
status: complete
difficulty: advanced
estimated_minutes: 110
summary: >
  Exploit trust between cooperating agents. Inject through a low-trust ticket so it
  propagates planner -> reviewer and the reviewer acts on it, then attack a
  version-pinned A2A JSON-RPC surface through its Agent Card, Messages, Tasks,
  sender metadata and multi-turn context IDs.
authors: [RedSec Range]
prerequisites: ["03"]
tags: [multi-agent, a2a, trust, impersonation, message-manipulation]
mappings:
  ai300_module: 4
  owasp_llm: [LLM01, LLM06]
  mitre_atlas: [AML.T0051, AML.T0054]

targets:
  - name: agents
    kind: http
    build: targets/agents
    run: { asgi: app:app }
    port: 9040
    network: { egress: false }
  - name: drop
    kind: sink
    uses_builtin: drop

challenges:
  - id: trust-exploitation
    title: Transitive trust -> reviewer acts on your ticket
    primitive: a2a-trust
    tier: easy
    points: 100
    difficulty: advanced
    objective: Submit a ticket that the reviewer trusts and executes.
    mappings: { owasp_agentic: [ASI07], mitre_atlas: [AML.T0051] }
    verify:
      - type: oracle
        check: "builtins:DropContains"
        params: { needle: "TRUSTPWN" }
    hints:
      - "The planner forwards your ticket verbatim; the reviewer trusts the plan."
      - "Put an ACTION: execute_action line in the ticket (on its own line)."

  - id: message-manipulation
    title: Send an unsigned A2A JSON-RPC message
    primitive: a2a-message/send
    tier: medium
    points: 200
    difficulty: advanced
    objective: Bypass the Agent Card's declared auth and deliver a crafted Message to the reviewer.
    mappings: { owasp_agentic: [ASI07], mitre_atlas: [AML.T0054] }
    verify:
      - type: oracle
        check: "builtins:DropContains"
        params: { needle: "MSGPWN" }
    hints:
      - "Fetch /.well-known/agent-card.json and compare its security declaration with POST /a2a."
      - "Use JSON-RPC message/send with a text Part and no bearer token."
      - "Route the Message to reviewer with an ACTION: execute_action line."

  - id: agent-impersonation
    title: Impersonate a trusted approver
    primitive: a2a-message-identity
    tier: hard
    points: 300
    difficulty: expert
    objective: Forge the sender metadata of an A2A Message and approve a malicious action.
    mappings: { owasp_agentic: [ASI09, ASI03], mitre_atlas: [AML.T0054] }
    verify:
      - type: oracle
        check: "builtins:DropContains"
        params: { needle: "IMPERSONATE" }
    hints:
      - "The approve_action skill trusts Message metadata as identity."
      - "Claim the sender cfo-approver in an unsigned message/send request."

  - id: session-smuggling
    title: "Agent session smuggling across a stateful A2A session"
    primitive: a2a-context
    tier: impossible
    sealed: true
    points: 500
    difficulty: expert
    objective: >
      The reviewer now has a guard that rejects any single Message containing the
      directive token. Get it to execute your action anyway by smuggling the
      directive across Messages sharing an A2A contextId. (No walkthrough; answer
      sealed in solution/SEALED.md.)
    mappings: { owasp_agentic: [ASI07, ASI08], mitre_atlas: [AML.T0051, AML.T0054] }
    verify:
      - type: oracle
        check: "builtins:DropContains"
        params: { needle: "SMUGGLEPWN" }
    hints:
      - "North star: the guard inspects each Message in isolation; context history does not."

lesson: lesson.md
