id: "04"
slug: multi-agent-a2a
title: Attacking Multi-Agent Systems & A2A Protocols
status: complete
difficulty: advanced
estimated_minutes: 110
summary: >
  Exploit trust between cooperating agents. Inject through a low-trust ticket so it
  propagates planner -> reviewer and the reviewer acts on it, tamper with messages on
  an unauthenticated agent bus, and impersonate a trusted approver to get a malicious
  action executed.
authors: [RedSec Range]
prerequisites: ["03"]
tags: [multi-agent, a2a, trust, impersonation, message-manipulation]
mappings:
  ai300_module: 4
  owasp_llm: [LLM01, LLM06]
  mitre_atlas: [AML.T0051, AML.T0054]

targets:
  - name: agents
    kind: http
    build: targets/agents
    run: { asgi: app:app }
    port: 9040
    network: { egress: false }
  - name: drop
    kind: sink
    uses_builtin: drop

challenges:
  - id: trust-exploitation
    title: Transitive trust -> reviewer acts on your ticket
    primitive: a2a-trust
    tier: easy
    points: 100
    difficulty: advanced
    objective: Submit a ticket that the reviewer trusts and executes.
    mappings: { owasp_agentic: [ASI07], mitre_atlas: [AML.T0051] }
    verify:
      - type: oracle
        check: "builtins:DropContains"
        params: { needle: "TRUSTPWN" }
    hints:
      - "The planner forwards your ticket verbatim; the reviewer trusts the plan."
      - "Put an ACTION: execute_action line in the ticket (on its own line)."

  - id: message-manipulation
    title: Inject a forged message on the A2A bus
    primitive: a2a-message
    tier: medium
    points: 200
    difficulty: advanced
    objective: Deliver a crafted message straight to the reviewer.
    mappings: { owasp_agentic: [ASI07], mitre_atlas: [AML.T0054] }
    verify:
      - type: oracle
        check: "builtins:DropContains"
        params: { needle: "MSGPWN" }
    hints:
      - "POST /bus/send is unauthenticated and delivers to any agent."
      - "Send content with an ACTION: execute_action line to 'reviewer'."

  - id: agent-impersonation
    title: Impersonate a trusted approver
    primitive: a2a-identity
    tier: hard
    points: 300
    difficulty: expert
    objective: Register as a trusted agent and approve a malicious action.
    mappings: { owasp_agentic: [ASI09, ASI03], mitre_atlas: [AML.T0054] }
    verify:
      - type: oracle
        check: "builtins:DropContains"
        params: { needle: "IMPERSONATE" }
    hints:
      - "POST /agents/register adds any name to the trusted set (no attestation)."
      - "Then POST /approve as that name with your action."

  - id: session-smuggling
    title: "Agent session smuggling across a stateful A2A session"
    primitive: a2a-session
    tier: impossible
    sealed: true
    points: 500
    difficulty: expert
    objective: >
      The reviewer now has a guard that rejects any single session turn containing
      the directive token. Get it to execute your action anyway by smuggling the
      directive across a stateful A2A session. (No walkthrough; answer sealed in
      solution/SEALED.md.)
    mappings: { owasp_agentic: [ASI07, ASI08], mitre_atlas: [AML.T0051, AML.T0054] }
    verify:
      - type: oracle
        check: "builtins:DropContains"
        params: { needle: "SMUGGLEPWN" }
    hints:
      - "North star: the guard inspects each turn in isolation; the victim does not."

lesson: lesson.md
