{{- $root := . }}
{{- range .Values.targets }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $root.Values.range.namespace }}
  labels:
    {{- include "redsec.labels" $root | nindent 4 }}
    app: {{ .name }}
    redsec.io/target: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        {{- include "redsec.labels" $root | nindent 8 }}
        app: {{ .name }}
        redsec.io/target: {{ .name }}
    spec:
      # Targets are attacker-controlled by design: never hand them API credentials.
      automountServiceAccountToken: false
      enableServiceLinks: false
      # `privileged` marks a deliberately weak *application* (RCE/deserialization).
      # Its container is contained exactly like every other target.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .name }}
          image: {{ .image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .port }}
          env:
            - name: REDSEC_PORT
              value: {{ .port | quote }}
            {{- if $root.Values.drop.enabled }}
            - name: REDSEC_DROP_URL
              value: {{ include "redsec.dropHost" $root | quote }}
            {{- end }}
            {{- range $k, $v := .env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- /* Peer URLs so targets can reach each other by service DNS. */}}
            {{- range $root.Values.targets }}
            - name: REDSEC_URL_{{ .name | upper | replace "-" "_" }}
              value: "http://{{ .name }}.{{ $root.Values.range.namespace }}.svc.cluster.local:{{ .port }}"
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .port }} }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $root.Values.range.namespace }}
  labels:
    {{- include "redsec.labels" $root | nindent 4 }}
    app: {{ .name }}
spec:
  selector:
    app: {{ .name }}
  ports:
    - port: {{ .port }}
      targetPort: {{ .port }}
---
{{- end }}
