{{- if .Values.drop.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.drop.name }}
  namespace: {{ .Values.range.namespace }}
  labels:
    {{- include "redsec.labels" . | nindent 4 }}
    app: {{ .Values.drop.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.drop.name }}
  template:
    metadata:
      labels:
        {{- include "redsec.labels" . | nindent 8 }}
        app: {{ .Values.drop.name }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: drop
          image: {{ .Values.drop.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.drop.port }}
          env:
            - name: REDSEC_DROP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.drop.name }}-token
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.drop.port }} }
            initialDelaySeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.drop.name }}
  namespace: {{ .Values.range.namespace }}
  labels:
    {{- include "redsec.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Values.drop.name }}
  ports:
    - port: {{ .Values.drop.port }}
      targetPort: {{ .Values.drop.port }}
{{- end }}
