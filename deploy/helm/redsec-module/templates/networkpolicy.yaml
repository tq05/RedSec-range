{{- $root := . }}
# Containment is a safety control AND a teaching point: a deliberately vulnerable
# app must not reach the internet or other ranges. This default-denies everything,
# then re-allows only intra-namespace traffic + DNS. Targets that explicitly set
# `egress: true` get an internet allowance.
#
# NOTE: NetworkPolicy requires a CNI that enforces it (Calico, Cilium, etc.).
# `kubectl port-forward` reaches targets via the API server and is unaffected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.range.namespace }}
  labels:
    {{- include "redsec.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-and-dns
  namespace: {{ .Values.range.namespace }}
  labels:
    {{- include "redsec.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # Any pod in this range namespace may talk to any other (host<->server, ->drop).
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    # DNS resolution (service discovery) only, and only to the cluster resolver.
    # An empty `to` would allow port 53 to any address (a DNS-tunnel egress path).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.dns.podLabels | nindent 14 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- range .Values.targets }}
{{- if .egress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-{{ .name }}
  namespace: {{ $root.Values.range.namespace }}
  labels:
    {{- include "redsec.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ .name }}
  policyTypes: [Egress]
  egress:
    - {}   # this target is explicitly allowed to reach the internet
{{- end }}
{{- end }}
