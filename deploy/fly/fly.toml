# Template used by deploy/fly/up.sh. The script always supplies a unique app name.
# No services or public ports are declared: access is only through Fly SSH/proxy.

app = "redsec-range-template"
primary_region = "lhr"

[build]
  # Paths in a Fly config are relative to this file. up.sh separately supplies
  # the repository root as Docker's build context so COPY . includes the course.
  dockerfile = "Dockerfile"

[env]
  MAX_RUNTIME_MIN = "0"
  # The Machine has no public service; `fly proxy` reaches its private address,
  # so ports bind on all interfaces with the explicit unsafe acknowledgement.
  REDSEC_BIND_HOST = "all"
  REDSEC_ALLOW_PUBLIC_BIND = "1"
  REDSEC_RANGES = "builtin"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
  # Retain the inner Docker images when this Machine restarts or is stopped/started.
  persist_rootfs = "restart"

[[restart]]
  # A TTL exit must leave the Machine stopped instead of starting it again.
  policy = "never"
