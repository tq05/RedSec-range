name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Lint (syntax errors and pyflakes)
        run: |
          pip install ruff==0.17.1
          ruff check .

  secrets:
    # Fails if any commit in the repository's history contains a credential.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full git history with gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum --check -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" kubernetes-validate
      - name: Validate all modules load
        run: |
          redsec doctor
          python scripts/generate_challenge_catalog.py --check
      - name: Unit + integration tests
        run: pytest -q
      - name: Prove every complete module is solvable (fail -> pass)
        run: redsec selftest
      - name: Offline Kubernetes manifest validation
        run: python scripts/validate_manifests.py

  learning-materials:
    # Defensive-only generation, integrity, reproducibility, and render checks.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation libharfbuzz-subset0 libpango-1.0-0 \
            libpangoft2-1.0-0 libreoffice-impress pandoc poppler-utils
          pip install -e ".[dev,training]"
      - name: Check committed sources and artifacts
        run: |
          python scripts/assemble_learning_materials.py --check
          pytest -q tests/test_learning_materials.py
      - name: Rebuild twice and prove deterministic output
        run: |
          python scripts/build_learning_materials.py
          sha256sum \
            docs/training/RedSec-Range-Learning-Guide.pdf \
            docs/training/RedSec-Range-Learning-Deck.pptx > /tmp/redsec-learning.sha256
          python scripts/build_learning_materials.py
          sha256sum --check /tmp/redsec-learning.sha256
          pytest -q tests/test_learning_materials.py
      - name: Render every slide with LibreOffice
        run: |
          mkdir -p /tmp/redsec-slides
          libreoffice --headless --convert-to pdf --outdir /tmp/redsec-slides \
            docs/training/RedSec-Range-Learning-Deck.pptx
          pdfinfo /tmp/redsec-slides/RedSec-Range-Learning-Deck.pdf \
            | grep -Eq '^Pages:[[:space:]]+222$'
          pdftotext /tmp/redsec-slides/RedSec-Range-Learning-Deck.pdf \
            /tmp/redsec-slides/deck.txt
          grep -Fq 'First contact' /tmp/redsec-slides/deck.txt
          grep -Fq 'Sources and licences' /tmp/redsec-slides/deck.txt

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: { version: v3.16.4 }
      - name: Install package + kubeconform
        run: |
          pip install -e .
          KC=v0.6.7
          KC_SHA256=95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
          curl -fsSL -o kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KC}/kubeconform-linux-amd64.tar.gz"
          echo "${KC_SHA256}  kc.tgz" | sha256sum --check -
          tar xzf kc.tgz && sudo mv kubeconform /usr/local/bin/
      - name: helm lint
        run: helm lint deploy/helm/redsec-module
      - name: Render + schema-validate the real generated manifests
        run: |
          for m in 01 02 03 04 05 06 07 08 09 11; do
            redsec render $m > /tmp/m$m.yaml
          done
          kubeconform -strict -summary -ignore-missing-schemas /tmp/m*.yaml

  containers:
    # Proves every challenge runs in REAL containers with service-name DNS
    # (the same networking model Kubernetes uses). No nested cluster required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Install package
        run: pip install -e .
      - name: Build the base runner image
        run: ./scripts/build_base_image.sh
      - name: Run all challenges in containers
        run: python scripts/docker_run_all.py

  codespaces:
    # Builds the same devcontainer used by Codespaces and exercises its command surface.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build devcontainer, start the range, and solve a module
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          runCmd: |
            test -f .redsec/codespaces-ready || ./scripts/codespaces-up.sh
            range status
            range solve 01

  external-ranges:
    # Builds every pinned third-party adapter and proves they run concurrently.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REDSEC_STATE: ${{ github.workspace }}/.redsec
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: Install RedSec
        run: pip install -e .
      - name: Start all external ranges on isolated networks
        run: |
          redsec ranges enable dvaa mcpgoat dvmcp appsecco-mcp
          redsec ranges up
          redsec ranges status
      - name: Check dashboards, adapters, and network isolation
        run: |
          curl -fsS http://127.0.0.1:9000/stats >/dev/null
          curl -fsS http://127.0.0.1:9000/api/challenges > /tmp/dvaa-challenges.json
          python -c 'import json; x=json.load(open("/tmp/dvaa-challenges.json")); assert len(x) == 22 and all(c.get("solution") for c in x)'
          curl -fsS http://127.0.0.1:7332/ >/dev/null
          redsec ranges entrypoints appsecco-mcp
          for port in $(seq 19001 19010) 13000 18000; do
            : > "/dev/tcp/127.0.0.1/$port"
          done
          for network in dvaa mcpgoat dvmcp appsecco-mcp; do
            test "$(docker network inspect -f '{{.Internal}}' "redsec-ext-$network")" = true
            test "$(docker inspect -f '{{len .NetworkSettings.Networks}}' "redsec-ext-$network")" = 1
            test "$(docker inspect -f '{{len .NetworkSettings.Networks}}' "redsec-ext-$network-gateway")" = 2
          done
      - name: Run MCPGoat's native all-level and Secure regression gate
        working-directory: .redsec/external-ranges/mcpgoat/source
        run: |
          npm ci
          npm run ci
      - name: Initialize every Appsecco stdio MCP server
        shell: bash
        run: |
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"redsec-ci","version":"1.0"}}}'
          entries=$(python -c 'from redsec.range_catalog import load_catalog; print(" ".join(load_catalog().ranges["appsecco-mcp"].runtime.entrypoints))')
          for entry in $entries; do
            printf '%s\n' "$request" | timeout 15 redsec ranges launch appsecco-mcp "$entry" > "/tmp/appsecco-$entry.json" || true
            grep -Eq '"id"[[:space:]]*:[[:space:]]*1' "/tmp/appsecco-$entry.json"
          done
      - name: Show logs and clean up
        if: always()
        run: |
          for container in dvaa mcpgoat dvmcp appsecco-mcp; do
            docker logs --tail 100 "redsec-ext-$container" || true
          done
          redsec ranges down --all || true

  fly-image:
    # Exercises the exact Fly image locally; no Fly credentials or paid resources.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate scripts and Fly config
        env:
          FLYCTL_VERSION: "0.4.111"
          FLYCTL_SHA256: 1878d7fb1f8a418039042cf0749e4b7216c6c7018b66ae10611a64c2b6d9aa9e
        run: |
          bash -n deploy/fly/*.sh scripts/sandbox-up.sh
          curl -fsSL -o /tmp/flyctl.tgz \
            "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          echo "${FLYCTL_SHA256}  /tmp/flyctl.tgz" | sha256sum --check -
          tar -xzf /tmp/flyctl.tgz -C /tmp flyctl
          FLY_API_TOKEN=dummy /tmp/flyctl config validate --config deploy/fly/fly.toml
      - name: Build Fly Docker-in-Docker image
        run: docker build -f deploy/fly/Dockerfile -t redsec/fly:test .
      - name: Boot one module and wait for readiness
        run: |
          docker run -d --privileged --name redsec-fly-smoke \
            -e REDSEC_MODULES=01 redsec/fly:test
          for _ in $(seq 1 90); do
            if docker exec redsec-fly-smoke test -f /run/redsec-ready; then
              docker exec redsec-fly-smoke range status
              exit 0
            fi
            docker inspect -f '{{.State.Running}}' redsec-fly-smoke | grep -qx true
            sleep 10
          done
          echo "range did not become ready" >&2
          exit 1
      - name: Solve and verify through the harness command surface
        run: docker exec redsec-fly-smoke range solve 01
      - name: Show logs and clean up
        if: always()
        run: |
          docker logs --tail 200 redsec-fly-smoke || true
          docker rm -f redsec-fly-smoke || true

  kind:
    # Full Kubernetes deploy on a runner that CAN nest (GitHub's can).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with: { cluster_name: redsec }
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: { version: v3.16.4 }
      - name: Install package
        run: pip install -e .
      - name: Bring up the range on kind and verify on-cluster
        run: |
          ./scripts/kind-up.sh
          ./scripts/kind-run-all.sh
