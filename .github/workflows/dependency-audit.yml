name: dependency-audit

# Known-vulnerability scan of every Python dependency the project and its images
# install. Runs on changes and weekly, so advisories published after a merge are
# still caught.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Install the project and pip-audit
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install pip-audit==2.10.1
          python -m pip install -e ".[dev,real-llm]"
      - name: Audit the project's resolved dependencies
        run: |
          python -m pip freeze --exclude-editable > /tmp/project-deps.txt
          /tmp/audit/bin/pip-audit --progress-spinner off -r /tmp/project-deps.txt
      - name: Audit the pinned image packages
        if: hashFiles('deploy/constraints.txt') != ''
        run: |
          grep -v '^#' deploy/constraints.txt > /tmp/image-deps.txt
          /tmp/audit/bin/pip-audit --progress-spinner off --no-deps -r /tmp/image-deps.txt
